<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Kevcode_Cademy</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-wrap{ max-width:400px; margin:60px auto; padding:0 20px; }
  .auth-wrap h1{ font-size:26px; margin-bottom:6px; }
  .auth-wrap .sub{ color:var(--ink-dim); font-size:14px; margin-bottom:28px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="/index.html">Kevcode<span>_</span>Cademy</a>
  <nav class="nav-links"><div data-auth-slot></div></nav>
</header>
<main>
  <div class="auth-wrap">
    <h1>Reset your password</h1>
    <p class="sub">We'll email you a link to set a new one.</p>
    <div class="form-msg" id="form-msg"></div>
    <form id="reset-form" novalidate>
      <div class="field" id="f-email">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <div class="field-error">Please enter a valid email.</div>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;" id="submit-btn">Send Reset Link</button>
    </form>
  </div>
</main>
<script type="module">
  import { initNav } from "/js/nav.js";
  import { resetPassword, friendlyAuthError } from "/js/auth.js";
  initNav("/forgot-password.html");

  const form = document.getElementById("reset-form");
  const msg = document.getElementById("form-msg");
  const submitBtn = document.getElementById("submit-btn");
  function showMsg(text, type){ msg.textContent = text; msg.className = "form-msg show " + type; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      showMsg("Enter a valid email address.", "error"); return;
    }
    submitBtn.disabled = true; submitBtn.textContent = "Sending…";
    try {
      await resetPassword(email);
      showMsg("If an account exists for that email, a reset link is on its way.", "success");
    } catch (err) {
      showMsg(friendlyAuthError(err), "error");
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = "Send Reset Link";
    }
  });
</script>
</body>
</html>
